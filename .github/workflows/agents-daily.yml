# ⚠ 이 파일은 adbles-agents/templates/workflows/agents-daily.yml 에서 생성됩니다.
# 여기서 고치지 말고 중앙 저장소 템플릿을 고친 뒤 `node scripts/deploy-fleet.mjs sync` 를 돌립니다.
#
# 매일 도는 SEO 사이클 — 순위를 재고(rankcheck), 황금키워드를 찾고(goldkey),
# 링크 후보를 모은다(linkmgr). 글은 쓰지 않는다. 그건 agents-publish 몫이다.
name: agents-daily (이사팁스)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: agents-isatips
  cancel-in-progress: false

jobs:
  cycle:
    # 킬스위치: 저장소 변수 AGENTS_ENABLED 를 false 로 두면 전부 멈춘다.
    if: vars.AGENTS_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_KEY: isatips
      AGENTS_DIR: ${{ github.workspace }}/_agents
      AGENT_STATE_DIR: ${{ github.workspace }}/.fleet/state
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # _agents 는 중앙 저장소 체크아웃이다. 커밋 대상이 아니다 —
      # .gitignore 가 아니라 .git/info/exclude 에 넣어 사이트 저장소를 더럽히지 않는다.
      - name: 체크아웃 경로 제외
        run: echo "_agents/" >> .git/info/exclude

      - name: 에이전트 원본 가져오기
        uses: actions/checkout@v4
        with:
          repository: playskang-svg/adbles-agents
          path: _agents
          ssh-key: ${{ secrets.AGENTS_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 자격증명 주입
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node "$AGENTS_DIR/runner/inject-credentials.mjs"

      - name: 이전 상태 복원
        run: node "$AGENTS_DIR/runner/state.mjs" restore --site "$SITE_KEY"

      # 각 단계는 실패해도 다음으로 넘어간다. 하나가 막혔다고 사이클 전체를 죽이면
      # 관리 에이전트가 무엇이 막혔는지 보고할 기회조차 없어진다.
      - name: rankcheck — 순위·색인 측정
        id: rank
        continue-on-error: true
        run: node "$AGENTS_DIR/agents/rankcheck/scripts/rank.mjs" check --site "$SITE_KEY"

      - name: rankcheck — 구글 서치콘솔
        continue-on-error: true
        run: node "$AGENTS_DIR/agents/rankcheck/scripts/gsc.mjs" inspect --site "$SITE_KEY"

      - name: goldkey — 황금키워드 발굴
        id: gold
        continue-on-error: true
        run: node "$AGENTS_DIR/agents/goldkey/scripts/goldkey.mjs" find --site "$SITE_KEY"

      # linkmgr collect 는 키워드 하나마다 도는 명령이다. 오늘 뽑힌 후보 키워드로 미리 모아 두면
      # 발행 회차에서 링크를 다시 긁지 않아도 된다.
      - name: linkmgr — 내일 쓸 링크 미리 수집
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: |
          node "$AGENTS_DIR/runner/pipeline.mjs" pick --site "$SITE_KEY" --n 3 --out "$RUNNER_TEMP/picks.json"
          node "$AGENTS_DIR/runner/pipeline.mjs" links --site "$SITE_KEY" --from "$RUNNER_TEMP/picks.json" --out "$RUNNER_TEMP/links.json"

      - name: 상태 저장
        if: always()
        run: node "$AGENTS_DIR/runner/state.mjs" save --site "$SITE_KEY" --commit

      - name: sitemgr — 관리 에이전트 보고
        if: always()
        run: node "$AGENTS_DIR/agents/sitemgr/scripts/sitemgr.mjs" report --site "$SITE_KEY" --issue
