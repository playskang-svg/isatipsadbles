name: Deploy external Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://isatips.adbles.com
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check migration files
        run: npm run audit:migration

      - name: Type-check source
        run: npm run lint

      - name: Build Worker
        run: npm run build

      - name: Configure Coupang secrets
        if: ${{ env.COUPANG_ACCESS_KEY != '' && env.COUPANG_SECRET_KEY != '' }}
        run: |
          printf '%s' "$COUPANG_ACCESS_KEY" | npx wrangler secret put COUPANG_ACCESS_KEY --config dist/server/wrangler.json
          printf '%s' "$COUPANG_SECRET_KEY" | npx wrangler secret put COUPANG_SECRET_KEY --config dist/server/wrangler.json

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Wait for deployment to serve
        run: sleep 30

      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs --days 2
