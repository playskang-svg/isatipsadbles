name: Verify site backup

on:
  push:
    branches: [main, "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check migration files and secrets
        run: npm run audit:migration

      - name: Type-check source
        run: npm run lint

      - name: Build deployable site
        run: npm run build
